name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no hardware access)
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n scripts/extract-firmware.sh
      - name: CLI help
        run: python3 scripts/px13_audio.py --help
